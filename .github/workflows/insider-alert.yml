name: OpenInsider Discord Alert

on:
  schedule:
    - cron: '0 */2 * * *'
  
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TARGET_TICKERS: ${{ secrets.TARGET_TICKERS }}
        run: python main.py

      - name: Commit and Push sent_records.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_records.txt
          git diff --staged --quiet || (git commit -m "Auto-update sent_records.txt" && git pull --rebase origin main && git push)
